<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 475" width="1000" height="475"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#d9b25c"/></marker></defs><rect width="1000" height="475" rx="18" fill="#0d0c0a"/><rect x="6" y="6" width="988" height="463" rx="14" fill="none" stroke="#b8892f" stroke-width="2" opacity=".6"/><text x="500.0" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="26" letter-spacing="4" fill="#e3c27a">HOW IT WORKS</text><text x="130" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="2" fill="#9c8c66">FROM YOUR DISC</text><text x="470" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="2" fill="#9c8c66">TRANSLATED ONCE</text><text x="830" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="2" fill="#9c8c66">WHILE YOU PLAY</text><rect x="40" y="115" width="180" height="60" rx="10" fill="#16140f" stroke="#6b5a35" stroke-width="1.5"/><text x="130.0" y="136.0" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#f3d58a">SLES_529.50</text><text x="130.0" y="153.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cdbb8f">the game's program</text><text x="130.0" y="167.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cdbb8f">(PS2 processor code)</text><rect x="40" y="205" width="180" height="60" rx="10" fill="#16140f" stroke="#6b5a35" stroke-width="1.5"/><text x="130.0" y="226.0" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#f3d58a">Function map</text><text x="130.0" y="243.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cdbb8f">strumenti/: where each</text><text x="130.0" y="257.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cdbb8f">function starts</text><rect x="40" y="330" width="180" height="60" rx="10" fill="#16140f" stroke="#6b5a35" stroke-width="1.5"/><text x="130.0" y="351.0" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#f3d58a">Your .iso</text><text x="130.0" y="368.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cdbb8f">models, textures,</text><text x="130.0" y="382.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cdbb8f">sound, movies</text><rect x="300" y="140" width="170" height="80" rx="10" fill="#3a2f17" stroke="#d9b25c" stroke-width="2"/><text x="385.0" y="164.0" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#f3d58a">PS2Recomp</text><text x="385.0" y="181.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cdbb8f">each instruction</text><text x="385.0" y="195.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cdbb8f">rewritten as C++</text><text x="385.0" y="209.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cdbb8f">+ patches/</text><rect x="510" y="140" width="150" height="80" rx="10" fill="#16140f" stroke="#6b5a35" stroke-width="1.5"/><text x="585.0" y="171.0" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#f3d58a">C++ files</text><text x="585.0" y="188.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cdbb8f">the original game</text><text x="585.0" y="202.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cdbb8f">code, translated</text><rect x="300" y="250" width="360" height="60" rx="10" fill="#16140f" stroke="#6b5a35" stroke-width="1.5"/><text x="480.0" y="278.0" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#f3d58a">CMake + Clang</text><text x="480.0" y="295.0" text-anchor=